<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="70" y="100" font-family="Meiryo,sans-serif" font-size="60" fill="#172c43">やまびこ1号</text><text x="74" y="152" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">口笛を聴き、AI がスライドホイッスルでまねて吹くロボット</text><rect x="70" y="215" width="280" height="140" rx="18" fill="#e2f2f1" stroke="#d2dce8" stroke-width="3"/><text x="95" y="267" font-family="Meiryo,sans-serif" font-size="32" fill="#172c43">人の口笛</text><text x="95" y="316" font-family="Meiryo,sans-serif" font-size="24" fill="#172c43">メロディーのお手本</text><rect x="70" y="420" width="280" height="170" rx="18" fill="#e2f2f1" stroke="#d2dce8" stroke-width="3"/><text x="95" y="470" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">MEMSマイク</text><text x="95" y="516" font-family="Meiryo,sans-serif" font-size="24" fill="#172c43">I2S（ICS-43434）</text><text x="95" y="554" font-family="Meiryo,sans-serif" font-size="22" fill="#172c43">口笛と笛の音程を聴く</text><polyline points="210,355 210,420" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="210,420 201.84976584372856,405.0810964478637 218.15023415627144,405.0810964478637" fill="#278c95"/><rect x="450" y="215" width="560" height="470" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="480" y="270" font-family="Meiryo,sans-serif" font-size="38" fill="#172c43">Arduino UNO Q</text><rect x="475" y="300" width="510" height="175" rx="18" fill="#eef4ff" stroke="#9db6e8" stroke-width="3"/><text x="500" y="342" font-family="Meiryo,sans-serif" font-size="28" fill="#172c43">Linux側</text><text x="500" y="381" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">耳（YIN）：10 ms ごとに音程</text><text x="500" y="419" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">NN（GRU）：駆動信号を直接出力</text><text x="500" y="457" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">口笛コピー・ウェブ画面</text><rect x="475" y="4