<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="70" y="88" font-family="Meiryo,sans-serif" font-size="48" fill="#172c43">デジタルツインで学び、NN が駆動信号を出す</text><text x="74" y="139" font-family="Meiryo,sans-serif" font-size="27" fill="#172c43">エンコーダなしの DC リニアアクチュエータを、聞こえた音程だけで制御する</text><rect x="70" y="180" width="330" height="170" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="92" y="223" font-family="Meiryo,sans-serif" font-size="27" fill="#278c95">01</text><text x="92" y="267" font-family="Meiryo,sans-serif" font-size="29" fill="#172c43">実機で較正</text><text x="92" y="316" font-family="Meiryo,sans-serif" font-size="20" fill="#172c43">全行程 約14秒、音と指令を記録</text><rect x="455" y="180" width="330" height="170" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="477" y="223" font-family="Meiryo,sans-serif" font-size="27" fill="#278c95">02</text><text x="477" y="267" font-family="Meiryo,sans-serif" font-size="29" fill="#172c43">デジタルツイン</text><text x="477" y="316" font-family="Meiryo,sans-serif" font-size="20" fill="#172c43">静止摩擦・管の長さ・速さ</text><rect x="840" y="180" width="330" height="170" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="862" y="223" font-family="Meiryo,sans-serif" font-size="27" fill="#278c95">03</text><text x="862" y="267" font-family="Meiryo,sans-serif" font-size="29" fill="#172c43">シミュレーターで学習</text><text x="862" y="316" font-family="Meiryo,sans-serif" font-size="20" fill="#172c43">音程誤差＋駆動信号の滑らかさ</text><rect x="1225" y="180" width="330" height="170" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="1247" y="223" font-family="Meiryo,sans-serif" font-size="27" fill="#278c95">04</text><text x="1247" y="267" font-family="Meiryo,sans-serif" font-size="29" fill="#172c43">UNO Q で推論</text><text x="1247" y="316" font-family="Meiryo,sans-serif" font-size="20" fill="#172c43">NumPy、1ステップ約1 ms</text><polyline points="400,265 455,265" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="455,265 440.0810964478637,273.15023415627144 440.0810964478637,256.84976584372856" fill="#278c95"/><polyline points="785,265 840,265" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="840,265 825.0810964478636,273.15023415627144 825.0810964478636,256.84976584372856" fill="#278c95"/><polyline points="1170,265 1225,265" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="1225,265 1210.0810964478637,273.15023415627144 1210.0810964478637,256.84976584372856" fill="#278c95"/><text x="75" y="425" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">実機の結果（2026-11-22、ドレミファミレド）</text><text x="75" y="480" font-family="Meiryo,sans-serif" font-size="25" fill="#172c43">1曲で駆動信号の向きが反転した回数</text><text x="75" y="524" font-family="Meiryo,sans-serif" font-size="24" fill="#172c43">従来の制御（PD＋位置の推定器）</text><rect x="560" y="500" width="780.0" height="46" rx="18" fill="#8294a9" stroke="#8294a9" stroke-width="3"/><text x="1360.0" y="530" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">300 回</text><text x="75" y="594" font-family="Meiryo,sans-serif" font-size="24" fill="#172c43">NN の制御（Step1）</text><rect x="560" y="570" width="23.400000000000002" height="46" rx="18" fill="#278c95" stroke="#278c95" stroke-width="3"/><text x="603.4" y="600" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">9 回</text><rect x="75" y="650" width="690" height="130" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="100" y="690" font-family="Meiryo,sans-serif" font-size="25" fill="#172c43">隣り合う音の音程の誤差</text><text x="100" y="750" font-family="Meiryo,sans-serif" font-size="40" fill="#278c95">13〜16 cent</text><rect x="830" y="650" width="690" height="130" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="855" y="690" font-family="Meiryo,sans-serif" font-size="25" fill="#172c43">音程が取れた割合</text><text x="855" y="750" font-family="Meiryo,sans-serif" font-size="40" fill="#278c95">99 %</text><text x="75" y="837" font-family="Meiryo,sans-serif" font-size="22" fill="#617286">100 cent ＝ 半音。従来の制御は静止摩擦を越えるため、細かく上下を繰り返していた。</text></svg>