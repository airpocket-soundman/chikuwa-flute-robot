<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="70" y="97" font-family="Meiryo,sans-serif" font-size="52" fill="#172c43">まず機体を知り、演奏を仕上げる</text><text x="74" y="154" font-family="Meiryo,sans-serif" font-size="29" fill="#172c43">デジタルツイン＋決定論制御＋ニューラルネットワークの補正</text><rect x="70" y="215" width="420" height="180" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="95" y="261" font-family="Meiryo,sans-serif" font-size="29" fill="#278c95">01</text><text x="95" y="314" font-family="Meiryo,sans-serif" font-size="34" fill="#172c43">約9秒の較正</text><text x="95" y="365" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">音と駆動指令から機体を推定</text><rect x="590" y="215" width="420" height="180" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="615" y="261" font-family="Meiryo,sans-serif" font-size="29" fill="#278c95">02</text><text x="615" y="314" font-family="Meiryo,sans-serif" font-size="34" fill="#172c43">デジタルツイン</text><text x="615" y="365" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">推定した機体で制御を仕上げる</text><rect x="1110" y="215" width="420" height="180" rx="18" fill="#ffffff" stroke="#d2dce8" stroke-width="3"/><text x="1135" y="261" font-family="Meiryo,sans-serif" font-size="29" fill="#278c95">03</text><text x="1135" y="314" font-family="Meiryo,sans-serif" font-size="34" fill="#172c43">繰り返し演奏</text><text x="1135" y="365" font-family="Meiryo,sans-serif" font-size="23" fill="#172c43">前の演奏を次の補正に使う</text><polyline points="490,305 580,305" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="580,305 565.0810964478636,313.15023415627144 565.0810964478636,296.84976584372856" fill="#278c95"/><polyline points="1010,305 1100,305" fill="none" stroke="#278c95" stroke-width="6"/><polygon points="1100,305 1085.0810964478637,313.15023415627144 1085.0810964478637,296.84976584372856" fill="#278c95"/><text x="75" y="470" font-family="Meiryo,sans-serif" font-size="30" fill="#172c43">固定シミュレーション評価：未知の機体32台 × 参照10曲（0.5倍速）</text><text x="75" y="553" font-family="Meiryo,sans-serif" font-size="28" fill="#172c43">決定論＋ツイン</text><rect x="440" y="525" width="720" height="52" rx="18" fill="#8294a9" stroke="#8294a9" stroke-width="3"/><text x="1185" y="559" font-family="Meiryo,sans-serif" font-size="36" fill="#172c43">80 %</text><text x="75" y="643" font-family="Meiryo,sans-serif" font-size="28" fill="#172c43">NN補正あり・1回目</text><rect x="440" y="615" width="828" height="52" rx="18" fill="#278c95" stroke="#278c95" stroke-width="3"/><text x="1293" y="649" font-family="Meiryo,sans-serif" font-size="36" fill="#172c43">92 %</text><text x="75" y="733" font-family="Meiryo,sans-serif" font-size="28" fill="#172c43">NN補正あり・3回目</text><rect x="440" y="705" width="837" height="52" rx="18" fill="#e59b3a" stroke="#e59b3a" stroke-width="3"/><text x="1302" y="739" font-family="Meiryo,sans-serif" font-size="36" fill="#172c43">93 %</text><text x="75" y="832" font-family="Meiryo,sans-serif" font-size="25" fill="#172c43">命中率：各音の開始から0.3秒以内に、目標の±25 centへ入った割合</text><text x="75" y="873" font-family="Meiryo,sans-serif" font-size="23" fill="#617286">資料：2026-09-24時点の計画・結果。数値はシミュレーションであり、実機では未検証。</text></svg>